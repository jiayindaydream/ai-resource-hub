// Storage Engine for AI Resource Hub (V7 with Enhanced Skills Hub & Dual Origin Support)
window.StorageEngine = {
  STORAGE_KEY: "AI_RESOURCE_HUB_DATA_V7",
  listeners: [],

  syncCounts(state) {
    if (!state) return state;
    if (!state.dashboardStats) state.dashboardStats = {};
    state.dashboardStats.promptCount = (state.prompts || []).length;
    state.dashboardStats.skillCount = (state.skills || []).length;
    state.dashboardStats.workflowCount = (state.workflows || []).length;
    state.dashboardStats.githubBookmarkCount = (state.githubProjects || []).length;
    return state;
  },

  getState() {
    try {
      const saved = localStorage.getItem(this.STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        return this.syncCounts(parsed);
      }
    } catch (e) {
      console.warn("Failed to parse stored data, falling back to clean starter data", e);
    }
    const initial = JSON.parse(JSON.stringify(window.MockData));
    this.syncCounts(initial);
    this.saveState(initial);
    return initial;
  },

  saveState(state) {
    try {
      this.syncCounts(state);
      localStorage.setItem(this.STORAGE_KEY, JSON.stringify(state));
      this.notify(state);
    } catch (e) {
      console.error("Failed to save state to localStorage", e);
    }
  },

  subscribe(fn) {
    this.listeners.push(fn);
    return () => {
      this.listeners = this.listeners.filter((l) => l !== fn);
    };
  },

  notify(state) {
    this.listeners.forEach((fn) => {
      try {
        fn(state);
      } catch (e) {
        console.error("Listener error", e);
      }
    });
  },

  // Reset to default clean starter templates
  resetData() {
    const initial = JSON.parse(JSON.stringify(window.MockData));
    this.syncCounts(initial);
    this.saveState(initial);
    return initial;
  },

  // Clear all data for a completely blank personal workspace
  clearAllData() {
    const state = this.getState();

// API Service Layer for AI Resource Hub
// Bridges with external open source services (LiteLLM, Karakeep, PromptManager) and public GitHub API

window.ApiService = {
  // Test connection to LiteLLM Proxy
  async testLiteLLM(url, masterKey) {
    try {
      const endpoint = (url || "http://localhost:4000").replace(/\/$/, "");
      const res = await fetch(`${endpoint}/health`, {
        headers: masterKey ? { Authorization: `Bearer ${masterKey}` } : {}
      });
      if (res.ok) {
        return { success: true, message: "LiteLLM Proxy 服务连通正常" };
      }
      return { success: false, message: `LiteLLM 响应异常状态: ${res.status}` };
    } catch (e) {
      return { success: false, message: `连接超时或网络未达: ${e.message}` };
    }
  },

  // Test connection to Karakeep
  async testKarakeep(url, apiKey) {
    try {
      const endpoint = (url || "http://localhost:8080").replace(/\/$/, "");
      const res = await fetch(`${endpoint}/api/v1/tags`, {
        headers: apiKey ? { Authorization: `Bearer ${apiKey}` } : {}
      });
      if (res.ok) {
        return { success: true, message: "Karakeep 服务连通正常" };
      }
      return { success: false, message: `Karakeep 响应异常状态: ${res.status}` };
    } catch (e) {
      return { success: false, message: `连接超时或网络未达: ${e.message}` };
    }
  },

  // Test connection to PromptManager
  async testPromptManager(url, apiKey) {
    try {
      const endpoint = (url || "http://localhost:3000").replace(/\/$/, "");
      const res = await fetch(`${endpoint}/api/health`, {
        headers: apiKey ? { Authorization: `Bearer ${apiKey}` } : {}
      });
      if (res.ok) {
        return { success: true, message: "PromptManager 服务连通正常" };
      }
      return { success: false, message: `PromptManager 响应异常状态: ${res.status}` };
    } catch (e) {
      return { success: false, message: `连接超时或网络未达: ${e.message}` };
    }
  },

  // Fetch GitHub Repository info automatically
  async fetchGithubRepoMetadata(repoInput) {
    try {
      // Clean input to get owner/repo
      let clean = repoInput.trim();
      clean = clean.replace(/^(https?:\/\/)?(www\.)?github\.com\//, "");
      clean = clean.replace(/\.git$/, "").replace(/\/$/, "");
      const parts = clean.split("/");
      if (parts.length < 2) {
        throw new Error("请输入有效的 GitHub 仓库格式 (例如: owner/repo 或完整链接)");
      }
      const owner = parts[0];
      const repo = parts[1];

      const res = await fetch(`https://api.github.com/repos/${owner}/${repo}`);
      if (!res.ok) {
        if (res.status === 404) throw new Error("未找到该 GitHub 仓库，请检查拼写");
        if (res.status === 403) throw new Error("GitHub API 调用频次达上限，请稍后再试");
        throw new Error(`GitHub 响应错误: ${res.status}`);
      }
      const data = await res.json();
      return {
        success: true,
        data: {
          name: data.name,
          owner: data.owner?.login || owner,
          fullName: data.full_name,
          repoUrl: data.html_url,
          description: data.description || "暂无描述",
          stars: data.stargazers_count || 0,
          forks: data.forks_count || 0,
          language: data.language || "Other",
          license: data.license?.spdx_id || data.license?.name || "None",
          topics: data.topics || []
        }
      };
    } catch (e) {
      return { success: false, error: e.message };
    }
  }
};

// Prompts Library View (Aligns with sidambili/prompt-manager)
window.PromptsView = function PromptsView({ state, setCurrentView }) {
  const Icons = window.Icons;
  const [activeCategory, setActiveCategory] = useState("全部");
  const [searchQuery, setSearchQuery] = useState("");
  const [selectedPrompt, setSelectedPrompt] = useState(null);
  const [showAddModal, setShowAddModal] = useState(false);
  const [showRunModal, setShowRunModal] = useState(null);
  const [runVariables, setRunVariables] = useState({});
  const [copyFeedback, setCopyFeedback] = useState(null);

  // New prompt form state
  const [newTitle, setNewTitle] = useState("");
  const [newDesc, setNewDesc] = useState("");
  const [newCategory, setNewCategory] = useState("Code Review");
  const [newTemplate, setNewTemplate] = useState("");
  const [newVersion, setNewVersion] = useState("v1.0.0");
  const [newTags, setNewTags] = useState("");

  const categories = ["全部", "Code Review", "Data Analysis", "Dev Tools", "Prompt Engineering"];

  const filteredPrompts = state.prompts.filter(p => {
    const matchCat = activeCategory === "全部" || p.category === activeCategory;
    const matchSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        p.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        p.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()));
    return matchCat && matchSearch;
  });

  const handleCopy = (prompt) => {
    navigator.clipboard.writeText(prompt.templateContent);
    setCopyFeedback(prompt.id);
    window.StorageEngine.updatePrompt(prompt.id, { copyCount: (prompt.copyCount || 0) + 1 });
    setTimeout(() => setCopyFeedback(null), 2000);
  };

  const handleCreatePrompt = (e) => {
    e.preventDefault();
    if (!newTitle.trim() || !newTemplate.trim()) return;

    // Detect variables like {{var}}
    const varRegex = /\{\{([^}]+)\}\}/g;
    const detectedVars = [];
    let match;
    while ((match = varRegex.exec(newTemplate)) !== null) {
      if (!detectedVars.includes(match[1].trim())) {
        detectedVars.push(match[1].trim());
      }
    }

    const promptObj = {
      title: newTitle.trim(),
      description: newDesc.trim() || "暂无描述",
      category: newCategory,
      currentVersion: newVersion.trim() || "v1.0.0",
      templateContent: newTemplate,
      variables: detectedVars,
      tags: newTags.split(/[,， ]+/).filter(Boolean),
      author: "Alex Lin"
    };

    window.StorageEngine.addPrompt(promptObj);
    setShowAddModal(false);
    setNewTitle("");
    setNewDesc("");
    setNewTemplate("");
    setNewTags("");
  };

  const handleOpenRun = (prompt) => {
    setShowRunModal(prompt);
    const initialVars = {};
    (prompt.variables || []).forEach(v => {
      initialVars[v] = "";
    });
    setRunVariables(initialVars);
  };

  const getComputedPrompt = () => {
    if (!showRunModal) return "";
    let content = showRunModal.templateContent;
    Object.keys(runVariables).forEach(k => {
      const val = runVariables[k] || `{{${k}}}`;
      content = content.replaceAll(`{{${k}}}`, val);
    });
    return content;
  };

  return (
    <div className="p-4 sm:p-6 md:p-8 space-y-6 max-w-7xl mx-auto pb-28 md:pb-24">
      {/* Top Banner & Action */}
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <div className="flex items-center gap-2">
            <h3 className="text-xl font-bold text-slate-900 dark:text-white">Prompts 提示词库</h3>
            <span className="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300">
              {state.prompts.length} 条已收录
            </span>
          </div>
          <p className="text-xs text-slate-500 mt-1">支持变量插槽、版本比对、一键复制与本地测试</p>
        </div>

        <button
          onClick={() => setShowAddModal(true)}
          className="self-start sm:self-auto flex items-center gap-1.5 px-4 py-2 rounded-full bg-blue-600 hover:bg-blue-700 text-white font-medium text-xs shadow-sm shadow-blue-500/20 transition-all"
        >
          <Icons.Plus size={15} />
          <span>新建 Prompt</span>
        </button>
      </div>

      {/* Filter and Search Bar */}
      <div className="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3 bg-white dark:bg-slate-900/80 p-2.5 rounded-2xl border border-slate-200/70 dark:border-slate-800/80 shadow-sm">
        {/* Category Pills */}
        <div className="flex items-center gap-1.5 overflow-x-auto pb-1 md:pb-0">
          {categories.map(cat => (
            <button
              key={cat}
              onClick={() => setActiveCategory(cat)}
              className={`px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-all ${
                activeCategory === cat
                  ? "bg-blue-600 text-white shadow-sm"
                  : "text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800"
              }`}
            >
              {cat}
            </button>
          ))}
        </div>

        {/* Search */}
        <div className="relative w-full md:w-64 shrink-0">
          <Icons.Search size={14} className="absolute left-3 top-2.5 text-slate-400" />
          <input
            type="text"
            placeholder="搜索提示词名称/标签..."
            value={searchQuery}
            onChange={(e) => setSearchQuery(e.target.value)}
            className="w-full pl-8 pr-3 py-1.5 rounded-xl bg-slate-100/70 dark:bg-slate-800 text-xs text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500 border border-transparent"
          />
        </div>
      </div>

      {/* Prompts Cards Grid or Empty State */}
      {filteredPrompts.length === 0 ? (
        <div className="bg-white dark:bg-slate-900/90 rounded-3xl p-12 text-center border border-slate-200/70 dark:border-slate-800/80 shadow-sm space-y-3">
          <div className="w-12 h-12 rounded-2xl bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 flex items-center justify-center mx-auto">

          </p>
          <button

          </button>

      ) : (

            <div

};

// Skills View Component - AI Skills Center (Self-created & Downloaded Skills Management)
window.SkillsView = function SkillsView({ state, setCurrentView }) {
  const Icons = window.Icons;
  const [selectedSkillId, setSelectedSkillId] = useState(state.skills[0]?.id || null);
  const [activeSourceTab, setActiveSourceTab] = useState("all"); // "all" | "custom" | "downloaded"
  const [searchQuery, setSearchQuery] = useState("");
  const [copySuccess, setCopySuccess] = useState(false);
  const [showCreateModal, setShowCreateModal] = useState(false);
  const [showEditModal, setShowEditModal] = useState(false);
  const [isNotesEditing, setIsNotesEditing] = useState(false);
  const [notesDraft, setNotesDraft] = useState("");

  const fileInputRef = useRef(null);

  // Form state for creating a new skill
  const [createForm, setCreateForm] = useState({
    title: "",
    name: "",
    source: "custom",
    author: "我 (自建原创)",
    sourceUrl: "",
    category: "Code & Standards",
    version: "1.0.0",
    tags: "TypeScript, Standards",
    description: "",
    notes: "",
    markdownContent: `# 技能名称与核心指令

## 1. 触发场景 (When to use)
在需要 ... 时激活此技能。

## 2. 执行规范与步骤
1. 第一步：分析上下文与输入
2. 第二步：执行核心逻辑
3. 第三步：输出结构化结果

## 3. 负面约束 (Negative Constraints)
- 禁止 ...
- 避免 ...`
  });

  // Form state for editing an existing skill
  const [editForm, setEditForm] = useState({
    id: "",
    title: "",
    name: "",
    source: "custom",
    author: "",
    sourceUrl: "",
    category: "",
    version: "",
    tags: "",
    description: "",
    notes: "",
    markdownContent: ""
  });

  const selectedSkill = state.skills.find(s => s.id === selectedSkillId) || state.skills[0];

  // Keep notesDraft in sync when selecting a skill
  useEffect(() => {
    if (selectedSkill) {
      setNotesDraft(selectedSkill.notes || "");
      setIsNotesEditing(false);
    }
  }, [selectedSkillId]);

  // Counts for tabs
  const customCount = (state.skills || []).filter(s => s.source === "custom").length;
  const downloadedCount = (state.skills || []).filter(s => s.source === "downloaded").length;

  // Filter skills by tab and search
  const filteredSkills = (state.skills || []).filter(skill => {
    if (activeSourceTab === "custom" && skill.source !== "custom") return false;
    if (activeSourceTab === "downloaded" && skill.source !== "downloaded") return false;
    if (!searchQuery.trim()) return true;
    const q = searchQuery.toLowerCase();
    return (
      (skill.title || "").toLowerCase().includes(q) ||
      (skill.name || "").toLowerCase().includes(q) ||
      (skill.description || "").toLowerCase().includes(q) ||
      (skill.notes || "").toLowerCase().includes(q) ||
      (skill.author || "").toLowerCase().includes(q) ||
      (skill.tags || []).some(t => t.toLowerCase().includes(q))
    );
  });

  // Copy Markdown content
  const handleCopyMarkdown = () => {
    if (selectedSkill) {
      navigator.clipboard.writeText(selectedSkill.markdownContent);
      setCopySuccess(true);
      setTimeout(() => setCopySuccess(false), 2000);
    }
  };

  // Export as .md file
  const handleExportMd = () => {
    if (!selectedSkill) return;
    const blob = new Blob([selectedSkill.markdownContent], { type: "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${selectedSkill.name || "skill"}_${selectedSkill.version || "1.0.0"}.md`;
    a.click();
    URL.revokeObjectURL(url);
  };

  // Delete skill
  const handleDeleteSkill = (id, title) => {
    if (confirm(`确定要删除技能「${title}」吗？`)) {
      window.StorageEngine.deleteSkill(id);
      if (selectedSkillId === id) {
        const remaining = state.skills.filter(s => s.id !== id);
        setSelectedSkillId(remaining[0]?.id || null);
      }
    }
  };

  // Quick save notes inline
  const handleSaveNotesInline = () => {
    if (selectedSkill) {
      window.StorageEngine.updateSkill(selectedSkill.id, { notes: notesDraft });
      setIsNotesEditing(false);
    }
  };

  // Open edit modal
  const handleOpenEdit = () => {
    if (!selectedSkill) return;
    setEditForm({
      id: selectedSkill.id,
      title: selectedSkill.title,
      name: selectedSkill.name,
      source: selectedSkill.source || "custom",
      author: selectedSkill.author || "",
      sourceUrl: selectedSkill.sourceUrl || "",
      category: selectedSkill.category || "",
      version: selectedSkill.version || "1.0.0",
      tags: (selectedSkill.tags || []).join(", "),
      description: selectedSkill.description || "",
      notes: selectedSkill.notes || "",
      markdownContent: selectedSkill.markdownContent || ""
    });
    setShowEditModal(true);
  };

  // Submit edit form
  const handleSubmitEdit = (e) => {
    e.preventDefault();
    if (!editForm.title.trim()) return;
    const tagsArr = editForm.tags
      .split(/[,，\s]+/)
      .map(t => t.trim())
      .filter(Boolean);

    window.StorageEngine.updateSkill(editForm.id, {
      title: editForm.title.trim(),
      name: editForm.name.trim() || editForm.title.toLowerCase().replace(/[^a-z0-9_-]/g, "-"),
      source: editForm.source,
      author: editForm.author.trim() || (editForm.source === "downloaded" ? "开源社区" : "我 (自建原创)"),
      sourceUrl: editForm.sourceUrl.trim(),
      category: editForm.category.trim() || "General",
      version: editForm.version.trim() || "1.0.0",
      tags: tagsArr.length > 0 ? tagsArr : ["Skill"],
      description: editForm.description.trim(),
      notes: editForm.notes.trim(),
      markdownContent: editForm.markdownContent
    });
    setShowEditModal(false);
  };

  // Submit create form
  const handleSubmitCreate = (e) => {
    e.preventDefault();
    if (!createForm.title.trim()) return;
    const tagsArr = createForm.tags
      .split(/[,，\s]+/)
      .map(t => t.trim())
      .filter(Boolean);

    const slug = createForm.name.trim() || createForm.title.toLowerCase().replace(/[^a-z0-9_-]/g, "-");
    const newSkill = {
      title: createForm.title.trim(),
      name: slug,
      source: createForm.source,
      author: createForm.author.trim() || (createForm.source === "downloaded" ? "开源社区" : "我 (自建原创)"),
      sourceUrl: createForm.sourceUrl.trim(),
      category: createForm.category.trim() || "Custom Skills",
      version: createForm.version.trim() || "1.0.0",
      tags: tagsArr.length > 0 ? tagsArr : ["Custom"],
      description: createForm.description.trim() || "个人自建技能规范说明",
      notes: createForm.notes.trim(),
      markdownContent: createForm.markdownContent
    };

    const created = window.StorageEngine.addSkill(newSkill);
    setSelectedSkillId(created.id);
    setShowCreateModal(false);
    // Reset form
    setCreateForm({
      title: "",
      name: "",
      source: "custom",
      author: "我 (自建原创)",
      sourceUrl: "",
      category: "Code & Standards",
      version: "1.0.0",
      tags: "TypeScript, Standards",
      description: "",
      notes: "",
      markdownContent: `# 技能名称与核心指令\n\n## 1. 触发场景\n...`
    });
  };

  // Smart file importer (parses YAML Frontmatter or Markdown)
  const handleImportFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      const rawText = event.target.result;
      const fileNameNoExt = file.name.replace(/\.(md|txt|markdown)$/i, "");

      let parsedTitle = fileNameNoExt;
      let parsedDesc = `从外部文件 ${file.name} 导入的技能包`;
      let parsedCategory = "外部导入";
      let parsedTags = ["Imported", "Markdown"];
      let parsedAuthor = "外部开源社区";
      let parsedUrl = "";

      // Try parsing simple YAML frontmatter (--- ... ---)
      const fmMatch = rawText.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/);
      let contentBody = rawText;

      if (fmMatch) {
        const yamlBlock = fmMatch[1];
        contentBody = fmMatch[2];
        const lines = yamlBlock.split(/\r?\n/);
        lines.forEach(line => {
          const colonIdx = line.indexOf(":");
          if (colonIdx > 0) {
            const key = line.slice(0, colonIdx).trim().toLowerCase();
            const val = line.slice(colonIdx + 1).trim().replace(/^['"]|['"]$/g, "");
            if (key === "title" || key === "name") parsedTitle = val;
            if (key === "description") parsedDesc = val;
            if (key === "category") parsedCategory = val;
            if (key === "author") parsedAuthor = val;
            if (key === "url" || key === "source") parsedUrl = val;
          }
        });
      } else {
        // Fallback: check first heading
        const headingMatch = rawText.match(/^#\s+(.+)$/m);
        if (headingMatch) {
          parsedTitle = headingMatch[1].trim();
        }
      }

      const slug = fileNameNoExt.toLowerCase().replace(/[^a-z0-9_-]/g, "-");
      const importedSkill = {
        name: slug,
        title: parsedTitle,
        source: "downloaded",
        author: parsedAuthor,
        sourceUrl: parsedUrl,
        category: parsedCategory,
        version: "1.0.0",

  const Icons = window.Icons;

  const [runningId, setRunningId] = useState(null);
  const [runLog, setRunLog] = useState(null);

  // New Workflow form state
  const [wfName, setWfName] = useState("");
  const [wfDesc, setWfDesc] = useState("");
  const [linkedPrompt, setLinkedPrompt] = useState(state.prompts[0]?.id || "");
  const [linkedSkill, setLinkedSkill] = useState(state.skills[0]?.id || "");
  const [linkedRepo, setLinkedRepo] = useState(state.githubProjects[0]?.id || "");
  const [recModel, setRecModel] = useState("claude-3-5-sonnet");

  const handleSimulateRun = (wf) => {
    const prompt = state.prompts.find(p => p.id === wf.linkedPromptId);
    const skill = state.skills.find(s => s.id === wf.linkedSkillId);
    const repo = state.githubProjects.find(r => r.id === wf.linkedGithubRepoId);

    setRunningId(wf.id);
    setRunLog({
      wfTitle: wf.name,
      status: "running",
      stepsCompleted: 0,
      totalSteps: 4,
      logs: [
        "🚀 启动端到端自动化编排工作流...",
        `📦 正在链接关联代码库: ${repo ? repo.fullName : "通用仓库"} (★ ${repo ? repo.stars.toLocaleString() : 0})`,
        `🛡️ 注入工程执行规约: ${skill ? skill.name : "默认标准"}`
      ]
    });

    setTimeout(() => {
      setRunLog(prev => ({
        ...prev,
        stepsCompleted: 1,
        logs: [...prev.logs, `✅ 步骤 1: 规则校验通过，规约标准 v${skill?.version || "1.0.0"} 注入上下文`]
      }));
    }, 700);

    setTimeout(() => {
      setRunLog(prev => ({
        ...prev,
        stepsCompleted: 2,
        logs: [...prev.logs, `🤖 步骤 2: 调用基座大模型 [${wf.recommendedModel}] 执行提示词评估...`]
      }));
    }, 1500);

    setTimeout(() => {
      setRunLog(prev => ({
        ...prev,
        stepsCompleted: 3,

    }, 2200);

    setTimeout(() => {
      setRunLog(prev => ({

        stepsCompleted: 4,
        logs: [
          ...prev.logs,
          "🎉 步骤 4: 执行成功并完成结构化归档！",
          "📈 耗时: 2,180ms | 消耗: 1,480 Tokens | 折合账单: $0.0092 USD | 状态: 200 OK"
        ]
      }));
      setRunningId(null);
    }, 2900);
  };

  const handleCreateWorkflow = (e) => {
    e.preventDefault();
    if (!wfName.trim()) return;

    const promptObj = state.prompts.find(p => p.id === linkedPrompt);
    const skillObj = state.skills.find(s => s.id === linkedSkill);
    const repoObj = state.githubProjects.find(r => r.id === linkedRepo);

    const newWf = {
      name: wfName.trim(),
      description: wfDesc.trim() || "自动化编排流水线",
      linkedPromptId: linkedPrompt,
      linkedSkillId: linkedSkill,
      linkedGithubRepoId: linkedRepo,
      recommendedModel: recModel,
      triggerType: "Git Hook / API Trigger",
      steps: [
        { step: 1, title: "代码库关联与规则注入", agent: "Knowledge Ingestion", repo: repoObj?.name || "开源库" },
        { step: 2, title: "工程规约静态分析", agent: "Skill Auditor", skill: skillObj?.name || "通用标准" },
        { step: 3, title: "提示词上下文合成与模型推理", agent: "LLM Runner", prompt: promptObj?.title || "核心提示词" }
      ]
    };

    window.StorageEngine.addWorkflow(newWf);
    setShowAddModal(false);
    setWfName("");
    setWfDesc("");

// GitHub Projects View (Aligns with Karakeep bookmarks & GitHub API auto-metadata fetcher)
window.GithubProjectsView = function GithubProjectsView({ state, setCurrentView }) {
  const Icons = window.Icons;
  const [activeStatus, setActiveStatus] = useState("全部");
  const [searchQuery, setSearchQuery] = useState("");
  const [showAddModal, setShowAddModal] = useState(false);
  const [inputRepo, setInputRepo] = useState("");
  const [isFetchingMeta, setIsFetchingMeta] = useState(false);
  const [fetchedMeta, setFetchedMeta] = useState(null);
  const [personalNotes, setPersonalNotes] = useState("");
  const [metaError, setMetaError] = useState("");

  const statuses = ["全部", "待研究", "研究中", "已掌握"];

  const filteredProjects = state.githubProjects.filter(p => {
    const matchStatus = activeStatus === "全部" || p.studyStatus === activeStatus;
    const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        p.fullName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        p.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        (p.notes && p.notes.toLowerCase().includes(searchQuery.toLowerCase()));
    return matchStatus && matchSearch;
  });

  // Auto fetch metadata from GitHub public API
  const handleFetchMetadata = async () => {
    if (!inputRepo.trim()) return;
    setIsFetchingMeta(true);
    setMetaError("");
    setFetchedMeta(null);

    const res = await window.ApiService.fetchGithubRepoMetadata(inputRepo);
    setIsFetchingMeta(false);

    if (res.success) {
      setFetchedMeta(res.data);
    } else {
      setMetaError(res.error || "获取元数据失败");
    }
  };

  const handleSaveProject = () => {
    if (!fetchedMeta) return;

    const newProject = {
      name: fetchedMeta.name,
      owner: fetchedMeta.owner,
      fullName: fetchedMeta.fullName,
      repoUrl: fetchedMeta.repoUrl,
      description: fetchedMeta.description,
      stars: fetchedMeta.stars,
      forks: fetchedMeta.forks,
      language: fetchedMeta.language,
      languageColor: "#3178c6",
      license: fetchedMeta.license,
      studyStatus: "待研究",
      notes: personalNotes.trim() || "暂无研读笔记",
      topics: fetchedMeta.topics || []
    };

    window.StorageEngine.addGithubProject(newProject);
    setShowAddModal(false);
    setInputRepo("");
    setFetchedMeta(null);
    setPersonalNotes("");
  };

  return (
    <div className="p-4 sm:p-6 md:p-8 space-y-6 max-w-7xl mx-auto pb-28 md:pb-24">
      {/* Top Banner */}
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <div className="flex items-center gap-2">
            <h3 className="text-xl font-bold text-slate-900 dark:text-white">GitHub 开源项目库</h3>
            <span className="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700 dark:bg-emerald-950/50 dark:text-emerald-300">
              {state.githubProjects.length} 个收藏
            </span>
          </div>
          <p className="text-xs text-slate-500 mt-1">自动解析 Star 数、编程语言与开源 License，精细化管理研读进度</p>
        </div>

        <button
          onClick={() => setShowAddModal(true)}
          className="self-start sm:self-auto flex items-center gap-1.5 px-4 py-2 rounded-full bg-blue-600 hover:bg-blue-700 text-white font-medium text-xs shadow-sm shadow-blue-500/20 transition-all"
        >
          <Icons.Plus size={15} />
          <span>收藏 GitHub 仓库</span>
        </button>
      </div>

      {/* Filter and Search */}
      <div className="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3 bg-white dark:bg-slate-900/80 p-2.5 rounded-2xl border border-slate-200/70 dark:border-slate-800/80 shadow-sm">
        {/* Status Pills */}
        <div className="flex items-center gap-1.5">
          {statuses.map(st => (
            <button
              key={st}
              onClick={() => setActiveStatus(st)}
              className={`px-3 py-1.5 rounded-full text-xs font-medium transition-all ${
                activeStatus === st
                  ? "bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-sm"
                  : "text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800"
              }`}
            >
              {st}
            </button>
          ))}
        </div>

        {/* Search Input */}
        <div className="relative w-full md:w-64">
          <Icons.Search size={14} className="absolute left-3 top-2.5 text-slate-400" />
          <input
            type="text"
            placeholder="搜索仓库名称/描述/笔记..."
            value={searchQuery}
            onChange={(e) => setSearchQuery(e.target.value)}
            className="w-full pl-8 pr-3 py-1.5 rounded-xl bg-slate-100/70 dark:bg-slate-800 text-xs text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500 border border-transparent"
          />
        </div>
      </div>

      {/* Projects Grid or Empty State */}
      {filteredProjects.length === 0 ? (
        <div className="bg-white dark:bg-slate-900/90 rounded-3xl p-12 text-center border border-slate-200/70 dark:border-slate-800/80 shadow-sm space-y-3">
          <div className="w-12 h-12 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 flex items-center justify-center mx-auto">
            <Icons.Github size={24} />
          </div>
          <h4 className="text-base font-bold text-slate-900 dark:text-white">暂无收藏的 GitHub 仓库</h4>
          <p className="text-xs text-slate-400 max-w-sm mx-auto">
            {searchQuery || activeStatus !== "全部" ? "未找到符合当前状态或关键词的开源项目" : "当前工作区暂无收藏代码库，输入 GitHub 链接即可自动解析 Star 与语言并加入工作台。"}
          </p>
          <button
            onClick={() => setShowAddModal(true)}
            className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-blue-600 hover:bg-blue-700 text-white font-medium text-xs shadow-sm transition-all mt-2"

              {/* Phase 3: Cross-Asset Workflow Linkage */}
              {(() => {

                    title="点击直接穿透跳转至编排流水线"
                  >

// Global Command Search Modal (Ctrl + K)
window.GlobalSearchModal = function GlobalSearchModal({ isOpen, onClose, state, onNavigate }) {
  const Icons = window.Icons;
  const [query, setQuery] = useState("");

  useEffect(() => {
    const handleKeyDown = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "k") {
        e.preventDefault();
        if (isOpen) onClose();
        else onNavigate(null, "openSearch");
      }
      if (e.key === "Escape" && isOpen) {
        onClose();
      }
    };
    window.addEventListener("keydown", handleKeyDown);
    return () => window.removeEventListener("keydown", handleKeyDown);
  }, [isOpen]);

  if (!isOpen) return null;

  const q = query.trim().toLowerCase();

  // Aggregate search results (Prompts, GitHub, Skills)
  const promptResults = (state.prompts || [])
    .filter(p => !q || p.title.toLowerCase().includes(q) || p.tags.some(t => t.toLowerCase().includes(q)))
    .slice(0, 5)
    .map(p => ({ type: "Prompt", icon: Icons.MessageSquare, title: p.title, sub: p.category, view: "prompts", id: p.id }));

  const githubResults = (state.githubProjects || [])
    .filter(g => !q || g.name.toLowerCase().includes(q) || g.fullName.toLowerCase().includes(q) || g.description.toLowerCase().includes(q))
    .slice(0, 5)
    .map(g => ({ type: "GitHub", icon: Icons.Github, title: g.fullName, sub: `★ ${g.stars} · ${g.language}`, view: "github", id: g.id }));

  const skillResults = (state.skills || [])
    .filter(s => !q || s.title.toLowerCase().includes(q) || s.name.toLowerCase().includes(q))
    .slice(0, 4)
    .map(s => ({ type: "Skill", icon: Icons.Wrench, title: s.title, sub: s.name, view: "skills", id: s.id }));

  const totalResults = [...promptResults, ...githubResults, ...skillResults];

  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center pt-20 p-4 bg-slate-900/60 backdrop-blur-md animate-in fade-in duration-150">
      <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-xl w-full border border-slate-200 dark:border-slate-800 shadow-2xl overflow-hidden flex flex-col">
        {/* Search Input Bar */}
        <div className="h-14 px-5 border-b border-slate-100 dark:border-slate-800 flex items-center gap-3">
          <Icons.Search size={18} className="text-slate-400" />
          <input
            autoFocus
            type="text"
            placeholder="键入提示词、GitHub 项目、技能规范或文章关键字..."
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            className="flex-1 bg-transparent text-sm text-slate-800 dark:text-slate-100 focus:outline-none"
          />
          <kbd className="px-2 py-0.5 text-[10px] font-mono rounded bg-slate-100 dark:bg-slate-800 text-slate-500 border border-slate-200 dark:border-slate-700">
            ESC 退出
          </kbd>
        </div>

        {/* Results List */}
        <div className="p-3 max-h-96 overflow-y-auto space-y-1">
          {totalResults.length > 0 ? (
            totalResults.map((item, idx) => {
              const IconComp = item.icon;
              return (
                <div
                  key={idx}
                  onClick={() => {
                    onNavigate(item.view);
                    onClose();
                  }}
                  className="p-3 rounded-2xl hover:bg-slate-100/80 dark:hover:bg-slate-800/60 cursor-pointer transition-colors flex items-center justify-between group"
                >
                  <div className="flex items-center gap-3 overflow-hidden">
                    <span className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 group-hover:bg-blue-600 group-hover:text-white transition-colors">
                      <IconComp size={15} />
                    </span>
                    <div className="truncate">
                      <div className="text-xs font-bold text-slate-900 dark:text-white truncate">
                        {item.title}
                      </div>
                      <div className="text-[11px] text-slate-400 truncate mt-0.5">
                        {item.sub}
                      </div>
                    </div>
                  </div>

                  <span className="shrink-0 px-2.5 py-0.5 rounded-full text-[10px] font-medium bg-slate-100 dark:bg-slate-800 text-slate-500">
                    {item.type}
                  </span>
                </div>
              );
            })
          ) : (
            <div className="py-12 text-center text-slate-400 text-xs">
              未找到匹配的资源，尝试更换搜索词
            </div>
          )}
        </div>

        {/* Footer shortcuts */}
        <div className="px-5 py-2.5 bg-slate-50 dark:bg-slate-800/40 border-t border-slate-100 dark:border-slate-800 text-[11px] text-slate-400 flex items-center justify-between">
          <span>支持跨 Prompt、Skill 与 GitHub 开源库秒级聚合检索</span>
          <span>按回车快速跳转</span>
        </div>
      </div>
    </div>
  );

// Root App Component for AI Resource Hub (Phase 3 Completed)
function App() {
  const [state, setState] = useState(() => window.StorageEngine.getState());
  const [currentView, setCurrentViewState] = useState(() => {
    const hash = window.location.hash.replace("#", "").trim();
    const validViews = ["dashboard", "prompts", "skills", "workflows", "github", "api-connections", "usage-analytics", "budgets"];
    return validViews.includes(hash) ? hash : "dashboard";
  });
  const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(false);
  const [isMobileSidebarOpen, setIsMobileSidebarOpen] = useState(false);
  const [isSearchOpen, setIsSearchOpen] = useState(false);
  const [isReportOpen, setIsReportOpen] = useState(false);

  const setCurrentView = useCallback((view) => {
    setCurrentViewState(view);
    if (window.location.hash.replace("#", "") !== view) {
      window.location.hash = view;
    }
  }, []);

  // Listen for browser forward/backward hash navigation
  useEffect(() => {
    const handleHashChange = () => {
      const hash = window.location.hash.replace("#", "").trim();
      if (hash && hash !== currentView) {
        setCurrentViewState(hash);
      }
    };
    window.addEventListener("hashchange", handleHashChange);
    return () => window.removeEventListener("hashchange", handleHashChange);
  }, [currentView]);

  // Subscribe to storage changes
  useEffect(() => {
    const unsubscribe = window.StorageEngine.subscribe((newState) => {
      setState({ ...newState });
    });
    return unsubscribe;
  }, []);

  // Sync theme
  useEffect(() => {
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark" || (!savedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.documentElement.classList.add("dark");
    } else {
      document.documentElement.classList.remove("dark");
    }
  }, []);

  const handleToggleMode = () => {
    const nextMode = state.serviceConfig?.mode === "live" ? "demo" : "live";
    window.StorageEngine.toggleDataMode(nextMode);
  };

  const handleQuickAdd = (type) => {
    if (type === "prompt") setCurrentView("prompts");
    else if (type === "github") setCurrentView("github");
    else if (type === "skill") setCurrentView("skills");
    else if (type === "api-key") setCurrentView("api-connections");
  };

  // View Router (Decoupled, high-impact modules with cross-asset relations)
  const renderView = () => {
    switch (currentView) {
      case "dashboard":
        return (
          <window.DashboardView
            state={state}
            setCurrentView={setCurrentView}
            onQuickAdd={handleQuickAdd}
            onOpenReport={() => setIsReportOpen(true)}
          />
        );
      case "prompts":
        return <window.PromptsView state={state} setCurrentView={setCurrentView} />;
      case "skills":
        return <window.SkillsView state={state} setCurrentView={setCurrentView} />;
      case "workflows":
        return <window.WorkflowsView state={state} setCurrentView={setCurrentView} />;
      case "github":
        return <window.GithubProjectsView state={state} setCurrentView={setCurrentView} />;
      case "api-connections":
        return <window.ApiConnectionsView state={state} setCurrentView={setCurrentView} />;
      case "usage-analytics":
        return <window.UsageAnalyticsView state={state} setCurrentView={setCurrentView} />;
      case "budgets":
        return <window.BudgetsView state={state} setCurrentView={setCurrentView} />;
      default:
        return (
          <window.DashboardView
            state={state}
            setCurrentView={setCurrentView}
            onQuickAdd={handleQuickAdd}
            onOpenReport={() => setIsReportOpen(true)}
          />
        );
    }
  };

  return (
    <div className="min-h-screen bg-[#F4F7FB] dark:bg-[#080C14] text-slate-800 dark:text-slate-100 flex transition-colors duration-200 font-sans">
      {/* Left Fixed Navigation Sidebar */}
      <window.Sidebar
        state={state}
        currentView={currentView}
        setCurrentView={setCurrentView}
        isCollapsed={isSidebarCollapsed}
        setIsCollapsed={setIsSidebarCollapsed}
        onOpenReport={() => setIsReportOpen(true)}
        isMobileOpen={isMobileSidebarOpen}
        onCloseMobile={() => setIsMobileSidebarOpen(false)}
      />

      {/* Main Content Pane */}
      <div className="flex-1 flex flex-col min-w-0 min-h-screen overflow-x-hidden pb-16 md:pb-0">
        <window.Header
          currentView={currentView}
          setCurrentView={setCurrentView}
          dataMode={state.serviceConfig?.mode || "demo"}
          onOpenSearch={() => setIsSearchOpen(true)}
          onQuickAdd={handleQuickAdd}
          onOpenReport={() => setIsReportOpen(true)}
          onToggleMobileSidebar={() => setIsMobileSidebarOpen(prev => !prev)}
        />

        <main className="flex-1 overflow-y-auto">
          {renderView()}
        </main>
      </div>

      {/* Mobile Floating Bottom Navigation Bar */}
      <nav className="fixed bottom-0 inset-x-0 z-30 md:hidden bg-white/95 dark:bg-[#0B0F17]/95 backdrop-blur-xl border-t border-slate-200/80 dark:border-slate-800/80 px-2 py-1.5 flex items-center justify-around shadow-lg pb-[max(0.5rem,env(safe-area-inset-bottom))]">
        <button
          onClick={() => setCurrentView("dashboard")}
          className={`flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl text-[10px] transition-colors ${
            currentView === "dashboard" ? "text-blue-600 dark:text-blue-400 font-bold" : "text-slate-500 dark:text-slate-400 font-medium"
          }`}
        >
          <window.Icons.LayoutDashboard size={19} className={currentView === "dashboard" ? "text-blue-600 dark:text-blue-400" : ""} />
          <span>看板</span>
        </button>

        <button
          onClick={() => setCurrentView("prompts")}
          className={`flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl text-[10px] transition-colors ${
            currentView === "prompts" ? "text-blue-600 dark:text-blue-400 font-bold" : "text-slate-500 dark:text-slate-400 font-medium"
          }`}
        >
          <window.Icons.MessageSquare size={19} className={currentView === "prompts" ? "text-blue-600 dark:text-blue-400" : ""} />
          <span>Prompts</span>
        </button>

        <button
          onClick={() => setCurrentView("workflows")}
          className={`flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl text-[10px] transition-colors ${
            currentView === "workflows" ? "text-blue-600 dark:text-blue-400 font-bold" : "text-slate-500 dark:text-slate-400 font-medium"
          }`}
        >
          <window.Icons.Workflow size={19} className={currentView === "workflows" ? "text-blue-600 dark:text-blue-400" : ""} />
          <span>工作流</span>
        </button>

        <button
          onClick={() => setCurrentView("api-connections")}
          className={`flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl text-[10px] transition-colors ${
            currentView === "api-connections" || currentView === "usage-analytics" || currentView === "budgets" ? "text-blue-600 dark:text-blue-400 font-bold" : "text-slate-500 dark:text-slate-400 font-medium"
          }`}
        >
          <window.Icons.Coins size={19} className={currentView === "api-connections" || currentView === "usage-analytics" || currentView === "budgets" ? "text-blue-600 dark:text-blue-400" : ""} />
          <span>成本/API</span>
        </button>

        <button
          onClick={() => setIsMobileSidebarOpen(true)}
          className="flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl text-[10px] font-medium text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200"
        >
          <window.Icons.Menu size={19} />
          <span>菜单</span>
        </button>
      </nav>

      {/* Global Search Dialog (Ctrl + K) */}
      <window.GlobalSearchModal
        isOpen={isSearchOpen}
        onClose={() => setIsSearchOpen(false)}
        state={state}
        onNavigate={(view, act) => {
          if (act === "openSearch") setIsSearchOpen(true);
          else if (view) setCurrentView(view);
        }}
      />

      {/* Phase 3: AI Portfolio Report Export Modal */}
      <window.ReportExportModal
        isOpen={isReportOpen}
        onClose={() => setIsReportOpen(false)}
        state={state}
      />
    </div>
  );
}

// Render root
const rootElement = document.getElementById("root");
if (rootElement) {
  const root = ReactDOM.createRoot(rootElement);
  root.render(<App />);
}
